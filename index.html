<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Balón de gas</title>
<!--STANDALONE:START-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Balón de gas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f161d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!--STANDALONE:END-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Concepto: una sola tarjeta con el balón en uso (días corriendo, avance contra el promedio),
   luego el resumen histórico, un gráfico de barras por balón y la lista de registros.
   Naranja llama para el balón, azul pizarra para el resto. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --ink: #14202b;
  --muted: #566371;
  --line: #d8dee5;
  --track: #e2e8ee;
  --accent: #c2410c;
  --accent-bg: #fdebe0;
  --on-accent: #ffffff;
  --over: #b42318;
  --over-bg: #fdecea;
  --scrim: rgba(10, 16, 22, 0.5);
  --font-display: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f161d;
    --surface: #18212b;
    --ink: #e9eef3;
    --muted: #9aa7b4;
    --line: #2a3541;
    --track: #26313c;
    --accent: #ff9158;
    --accent-bg: #3a2619;
    --on-accent: #1d0d02;
    --over: #ff9b92;
    --over-bg: #3b1f1d;
    --scrim: rgba(0, 0, 0, 0.62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f161d;
  --surface: #18212b;
  --ink: #e9eef3;
  --muted: #9aa7b4;
  --line: #2a3541;
  --track: #26313c;
  --accent: #ff9158;
  --accent-bg: #3a2619;
  --on-accent: #1d0d02;
  --over: #ff9b92;
  --over-bg: #3b1f1d;
  --scrim: rgba(0, 0, 0, 0.62);
  color-scheme: dark;
}
html.lock { overflow: hidden; }
[hidden]:not([hidden=until-found i]) { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-inline: 16px;
  -webkit-text-size-adjust: 100%;
}
.app { max-width: 480px; margin: 0 auto; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 18px; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
h1, h2 { margin: 0; font-family: var(--font-display); letter-spacing: -0.01em; text-wrap: balance; }
.eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.muted { color: var(--muted); margin: 0; }
svg { display: block; }

/* Encabezado */
.top { display: flex; align-items: center; gap: 12px; }
.mark { width: 44px; height: 44px; border-radius: 14px; background: var(--accent-bg); color: var(--accent); display: grid; place-items: center; flex: none; }
.top h1 { font-size: 28px; font-weight: 700; line-height: 1.1; }

/* Botones */
.btn {
  min-height: 52px; padding: 0 20px; border-radius: 14px; border: 1.5px solid transparent;
  font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:active { opacity: 0.85; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.danger { background: transparent; border-color: var(--over); color: var(--over); }
.btn.danger.armed { background: var(--over); color: var(--bg); }
.btn.small { min-height: 44px; padding: 0 14px; font-size: 15px; }
.btn.block { width: 100%; }

/* Balón en uso */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chip { display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border-radius: 999px; background: var(--accent-bg); color: var(--accent); font-weight: 600; font-size: 14px; }
.days { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.days b { font-family: var(--font-display); font-weight: 700; font-size: 76px; line-height: 0.95; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
.days span { font-size: 20px; font-weight: 600; color: var(--muted); }
.since { margin: 0; color: var(--muted); }
.bar { height: 12px; border-radius: 999px; background: var(--track); overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.bar.over > span { background: var(--over); }
.pace { margin: 0; font-size: 15px; }
.pace.over { color: var(--over); font-weight: 600; }
.hint { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
.card .row-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.card .row-actions .btn { flex: 1 1 0; min-width: 0; }
.card .row-actions .btn.primary { flex: 1 1 100%; }
.card .row-actions .btn.ghost { padding: 0 8px; white-space: nowrap; }
.empty-title { font-family: var(--font-display); font-size: 24px; font-weight: 700; line-height: 1.15; text-wrap: balance; margin: 0; }

/* Balones: en uso y de reserva */
.fleet { display: flex; justify-content: center; gap: 20px; padding: 4px 0 2px; }
.unit { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; flex: 1 1 0; max-width: 150px; }
.unit svg { width: 92px; max-width: 100%; height: auto; }
.cap { text-align: center; line-height: 1.25; }
.cap b { display: block; font-size: 15px; font-weight: 600; }
.cap span { display: block; font-size: 13px; color: var(--muted); }
.t-shell { fill: var(--track); stroke: none; }
.t-fill { fill: var(--accent); }
.t-outline { fill: none; stroke: var(--muted); stroke-width: 2.5; stroke-linejoin: round; }
.t-outline.is-empty { stroke-dasharray: 6 5; }
.t-handle { fill: none; stroke: var(--muted); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.t-valve, .t-base { fill: var(--muted); }
.row.is-reserve .dur b { color: var(--muted); }

/* Resumen */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.big small { font-family: var(--font-body); font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 6px; }
.note { margin: 10px 4px 0; font-size: 14px; color: var(--muted); }
.note strong { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

/* Gráfico */
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.sec-head h2 { font-size: 22px; }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 12px 12px; }
.chart svg { width: 100%; height: auto; max-width: 100%; }
.c-bar { fill: var(--accent); }
.c-val { fill: var(--ink); font-size: 12px; font-weight: 600; text-anchor: middle; font-variant-numeric: tabular-nums; }
.c-lab { fill: var(--muted); font-size: 11px; text-anchor: middle; }
.c-base { stroke: var(--line); stroke-width: 1.5; }
.c-avg { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 5 4; }
.legend { display: flex; align-items: center; gap: 8px; margin: 8px 4px 0; font-size: 13px; color: var(--muted); }
.legend i { width: 22px; border-top: 2px dashed var(--ink); display: inline-block; }

/* Historial */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.row {
  width: 100%; text-align: left; display: grid; grid-template-columns: 62px minmax(0, 1fr) 20px; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; min-height: 64px;
}
.row:active { background: var(--track); }
.row.is-active { border: 2px solid var(--accent); padding: 11px 13px; }
.dur { text-align: center; line-height: 1; }
.dur b { display: block; font-family: var(--font-display); font-weight: 700; font-size: 30px; font-variant-numeric: tabular-nums; }
.dur span { display: block; margin-top: 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.row.is-active .dur b { color: var(--accent); }
.info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.range { font-weight: 600; }
.meta { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.badge { background: var(--accent-bg); color: var(--accent); border-radius: 999px; font-size: 12px; font-weight: 600; padding: 2px 10px; }
.row > svg { color: var(--muted); }
.empty { margin: 0; padding: 16px; border: 1.5px dashed var(--line); border-radius: 18px; color: var(--muted); }

/* Respaldo */
.backup { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 4px 16px; }
.backup summary { min-height: 48px; display: flex; align-items: center; font-weight: 600; cursor: pointer; }
.backup[open] { padding-bottom: 16px; }
.backup > *:not(summary) { margin-top: 10px; }
.backup textarea { width: 100%; box-sizing: border-box; border: 1.5px solid var(--line); border-radius: 12px; background: var(--bg); padding: 10px 12px; font-size: 14px; font-family: ui-monospace, Menlo, monospace; resize: vertical; }
.bk-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.bk-actions .btn { flex: 1; min-width: 0; min-height: 48px; }

/* Hoja de registro */
.sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: flex-end; justify-content: center; }
.backdrop { position: absolute; inset: 0; background: var(--scrim); }
.panel {
  position: relative; width: 100%; max-width: 480px; max-height: 92%; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 24px 24px 0 0; box-sizing: border-box;
  padding: 22px 16px calc(22px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 16px; animation: rise 0.2s ease-out;
}
.panel:focus { outline: none; }
.panel h2 { font-size: 24px; }
.panel .sub { margin: -8px 0 0; color: var(--muted); font-size: 15px; }
.field { display: flex; flex-direction: column; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > span, .field > legend { font-size: 14px; font-weight: 600; padding: 0; }
.field input[type="date"], .field input[type="text"] {
  display: block; width: 100%; min-width: 0; min-height: 52px; box-sizing: border-box;
  -webkit-appearance: none; appearance: none; font-size: 16px;
  border: 1.5px solid var(--line); border-radius: 12px; padding: 0 14px; background: var(--bg); color: var(--ink);
}
.price-wrap { position: relative; }
.price-wrap b { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; pointer-events: none; }
.price-wrap input { padding-left: 30px !important; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips label {
  min-height: 48px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--bg);
  display: inline-flex; align-items: center; font-weight: 600; cursor: pointer;
}
.chips input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chips input:checked + label { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chips input:focus-visible + label { outline: 3px solid var(--ink); outline-offset: 2px; }
.err { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--over-bg); color: var(--over); font-weight: 600; font-size: 15px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .panel { animation: none; } }

.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 448px; margin: 0 auto; z-index: 20;
  background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 14px; font-size: 15px; text-align: center;
}
</style>
</head>
<body>

<main class="app" id="app" aria-live="polite"></main>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';

  var MES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  var LS_KEY = 'balon-gas-registros';
  var PRESETS = [5, 11, 15, 45];
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

  var I_CHEV = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var I_PLUS = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
  var I_FLAME = '<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 2.5c.6 3.2 3.2 4.9 4.6 7.3 1.3 2.2 1.4 4.3.5 6.1-1 2-3 3.3-5.1 3.3-2.5 0-4.6-1.8-5.1-4.2-.4-2 .4-3.8 1.7-5.2.2 1.4.9 2.3 1.9 2.7C10.2 9.8 10.3 6 12 2.5z" fill="currentColor"/></svg>';

  var app = document.getElementById('app');
  var sheetEl = document.getElementById('sheet');
  var toastEl = document.getElementById('toast');

  var tanks = [];
  var loading = !!(window.claude && window.claude.use);
  var mode = 'local';
  var db = null;
  var sheet = null;
  var busy = false;
  var restoreArmed = false;

  /* ---------- Fechas y formatos ---------- */
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function todayKey() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function utc(k) { var p = k.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
  function diff(a, b) { return Math.round((utc(b) - utc(a)) / 86400000); }
  function addDays(k, n) { var d = new Date(utc(k) + n * 86400000); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function fmt(k, noYear) { var p = k.split('-'); return (+p[2]) + ' ' + MES[+p[1] - 1] + (noYear ? '' : ' ' + p[0]); }
  function range(a, b) { return a.slice(0, 4) === b.slice(0, 4) ? fmt(a, true) + ' – ' + fmt(b) : fmt(a) + ' – ' + fmt(b); }
  function num(n) { return String(n).replace('.', ','); }
  function plural(n, s, p) { return n === 1 ? s : p; }
  function money(n) { return '$' + String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
  function genId() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  /* ---------- Datos ---------- */
  function norm(t) {
    if (!t) return null;
    var open = DATE_RE.test(String(t.open)) ? String(t.open) : null;
    var bought = DATE_RE.test(String(t.bought)) ? String(t.bought) : null;
    if (!open && !bought) return null;
    var close = open && t.close && DATE_RE.test(String(t.close)) ? String(t.close) : null;
    if (close && close < open) return null;
    var id = String(t.id || '').replace(/[^\w-]/g, '') || genId();
    var kg = +t.kg > 0 ? +t.kg : null;
    var price = +t.price > 0 ? Math.round(+t.price) : null;
    return { id: id, bought: bought, open: open, close: close, kg: kg, price: price };
  }
  function toDoc(t) { return { bought: t.bought || '', open: t.open || '', close: t.close || '', kg: t.kg || 0, price: t.price || 0 }; }
  function sortKey(t) { return t.open || t.bought; }
  function sortTanks() {
    tanks.sort(function (a, b) {
      var ra = !a.open, rb = !b.open;
      if (ra !== rb) return ra ? -1 : 1;
      var ka = sortKey(a), kb = sortKey(b);
      return ka < kb ? 1 : ka > kb ? -1 : (a.id < b.id ? 1 : -1);
    });
  }
  function find(id) { for (var i = 0; i < tanks.length; i++) if (tanks[i].id === id) return tanks[i]; return null; }
  function activeTank() { for (var i = 0; i < tanks.length; i++) if (tanks[i].open && !tanks[i].close) return tanks[i]; return null; }
  // Balones comprados y aún sin abrir, del más antiguo al más nuevo (se usa primero el más antiguo)
  function reserves() {
    return tanks.filter(function (t) { return !t.open; }).sort(function (a, b) { return a.bought < b.bought ? -1 : a.bought > b.bought ? 1 : (a.id < b.id ? -1 : 1); });
  }

  function loadLocal() {
    var list = [];
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) JSON.parse(raw).forEach(function (t) { var n = norm(t); if (n) list.push(n); });
    } catch (e) {}
    tanks = list; sortTanks();
  }
  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(tanks)); } catch (e) {} }

  async function commit(ups, rems) {
    rems = rems || [];
    var next = tanks.filter(function (t) { return rems.indexOf(t.id) < 0 && !ups.some(function (u) { return u.id === t.id; }); }).concat(ups);
    if (mode === 'db' && db) {
      try {
        for (var i = 0; i < ups.length; i++) await db.collection('balones').doc(ups[i].id).set(toDoc(ups[i]));
        for (var j = 0; j < rems.length; j++) await db.collection('balones').doc(rems[j]).delete();
      } catch (e) { toast('No se pudo guardar. Intenta de nuevo.'); return false; }
    }
    tanks = next; sortTanks();
    if (mode !== 'db') saveLocal();
    render();
    return true;
  }

  function toast(msg) {
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { toastEl.hidden = true; }, 3200);
  }

  /* ---------- Cálculos ---------- */
  function stats() {
    var rows = tanks.filter(function (t) { return t.close; }).map(function (t) { return { t: t, d: diff(t.open, t.close) }; });
    var st = { n: rows.length, rows: rows, avg: null, min: null, max: null, perDay: null, perTank: null };
    if (!rows.length) return st;
    var sum = 0, min = Infinity, max = -Infinity;
    rows.forEach(function (r) { sum += r.d; if (r.d < min) min = r.d; if (r.d > max) max = r.d; });
    st.avg = sum / rows.length; st.min = min; st.max = max;
    var priced = rows.filter(function (r) { return r.t.price; });
    if (priced.length) {
      var ps = 0, ds = 0;
      priced.forEach(function (r) { ps += r.t.price; ds += r.d; });
      st.perTank = ps / priced.length;
      if (ds > 0) st.perDay = ps / ds;
    }
    return st;
  }

  /* ---------- Vistas ---------- */
  function header() {
    return '<header class="top"><span class="mark">' + I_FLAME + '</span><div><div class="eyebrow">Gas licuado</div><h1>Balón de gas</h1></div></header>';
  }

  var BODY = 'M16 62Q16 26 50 26Q84 26 84 62V120Q84 134 70 134H30Q16 134 16 120Z';
  // Figura de un balón; `frac` es la parte que sigue llena (0 a 1)
  function tankSvg(frac, uid, label) {
    frac = Math.max(0, Math.min(1, frac));
    var hh = 108 * frac, y = 134 - hh;
    return '<svg viewBox="0 0 100 150" role="img" aria-label="' + label + '">' +
      '<defs><clipPath id="cp-' + uid + '"><path d="' + BODY + '"/></clipPath></defs>' +
      '<path class="t-handle" d="M33 24V15Q33 9 39 9H61Q67 9 67 15V24"/>' +
      '<rect class="t-valve" x="44" y="14" width="12" height="14" rx="3"/>' +
      '<rect class="t-base" x="24" y="132" width="52" height="11" rx="4"/>' +
      '<path class="t-shell" d="' + BODY + '"/>' +
      (frac > 0 ? '<rect class="t-fill" x="0" y="' + y.toFixed(1) + '" width="100" height="' + hh.toFixed(1) + '" clip-path="url(#cp-' + uid + ')"/>' : '') +
      '<path class="t-outline' + (frac === 0 ? ' is-empty' : '') + '" d="' + BODY + '"/></svg>';
  }

  // Dos balones: el que está en uso (según su consumo) y el de reserva (lleno si está comprado)
  function fleet(act, st) {
    var res = reserves();
    var f1 = 0, t1 = 'Sin uso', s1 = 'Vacío', l1;
    if (act) {
      var d = Math.max(diff(act.open, todayKey()), 0);
      t1 = 'En uso';
      if (st.avg == null) { f1 = 1; s1 = 'Sin promedio aún'; l1 = 'Balón en uso, sin promedio para estimar el consumo'; }
      else {
        var avgR = Math.max(Math.round(st.avg), 1);
        var used = Math.min(d / avgR, 1);
        f1 = 1 - used;
        s1 = d > avgR ? 'Sobre el promedio' : 'Consumido ~' + Math.round(used * 100) + '%';
        l1 = 'Balón en uso, consumido ' + Math.round(used * 100) + ' por ciento';
      }
      if (act.kg) t1 += ' · ' + act.kg + ' kg';
    }
    if (!l1) l1 = 'Sin balón en uso, vacío';
    var n = res.length, f2 = n ? 1 : 0;
    var t2 = 'Reserva' + (n > 1 ? ' ×' + n : ''), s2 = n ? 'Lleno, sin abrir' : 'Sin reserva';
    if (n && res[0].kg) t2 += ' · ' + res[0].kg + ' kg';
    return '<div class="fleet">' +
      '<div class="unit">' + tankSvg(f1, 'uso', l1) + '<div class="cap"><b>' + t1 + '</b><span>' + s1 + '</span></div></div>' +
      '<div class="unit">' + tankSvg(f2, 'res', n ? 'Balón de reserva, lleno' : 'Sin balón de reserva, vacío') + '<div class="cap"><b>' + t2 + '</b><span>' + s2 + '</span></div></div>' +
      '</div>';
  }

  function activeCard(act, st) {
    var d = Math.max(diff(act.open, todayKey()), 0);
    var hasRes = reserves().length > 0;
    var h = '<section class="card" aria-label="Balón en uso">';
    h += '<div class="card-head"><span class="eyebrow">Balón en uso</span>' + (act.kg ? '<span class="chip">' + act.kg + ' kg</span>' : '') + '</div>';
    h += '<div class="days"><b>' + d + '</b><span>' + plural(d, 'día', 'días') + ' de uso</span></div>';
    h += '<p class="since">' + (d === 0 ? 'Abierto hoy, ' : 'Abierto el ') + fmt(act.open) + '</p>';
    h += fleet(act, st);
    if (st.avg == null) {
      h += '<p class="pace muted">El promedio se calcula cuando se cierra el primer balón.</p>';
    } else {
      var avgR = Math.max(Math.round(st.avg), 1);
      var left = avgR - d;
      var avgTxt = num(Math.round(st.avg * 10) / 10);
      if (left > 0) h += '<p class="pace">Con tu promedio de ' + avgTxt + ' días, duraría hasta el ' + fmt(addDays(act.open, avgR)) + ' (faltan unos ' + left + ' ' + plural(left, 'día', 'días') + ').</p>';
      else if (left === 0) h += '<p class="pace">Llegó a tu promedio de ' + avgTxt + ' días.</p>';
      else h += '<p class="pace over">Lleva ' + (-left) + ' ' + plural(-left, 'día', 'días') + ' sobre tu promedio de ' + avgTxt + ' días.</p>';
    }
    h += '<div class="row-actions"><button class="btn primary" data-act="open">' + (hasRes ? 'Abrir balón de reserva' : 'Abrir nuevo balón') + '</button>' +
      '<button class="btn ghost" data-act="buy">Registrar compra</button>' +
      '<button class="btn ghost" data-act="edit" data-id="' + act.id + '">Editar</button></div>';
    h += '<p class="hint">' + (hasRes ? 'Al abrir la reserva, el balón actual se cierra en esa misma fecha.' : 'Si ya compraste el próximo balón, regístralo con “Registrar compra”.') + '</p>';
    return h + '</section>';
  }

  function emptyCard(st) {
    var hasRes = reserves().length > 0;
    return '<section class="card" aria-label="Sin balón en uso"><span class="eyebrow">Sin balón en uso</span>' +
      '<p class="empty-title">' + (hasRes ? 'Tienes un balón de reserva lleno' : 'Registra el balón que estás usando') + '</p>' +
      '<p class="muted">' + (hasRes ? 'Cuando lo abras, la app cuenta los días de uso desde esa fecha.' : 'Indica cuándo lo abriste y la app cuenta los días de uso hasta que lo reemplaces.') + '</p>' +
      fleet(null, st) +
      '<div class="row-actions"><button class="btn primary" data-act="open">' + (hasRes ? 'Abrir balón de reserva' : 'Abrir balón') + '</button>' +
      '<button class="btn ghost" data-act="buy">Registrar compra</button></div></section>';
  }

  function statsBlock(st) {
    function tile(label, val, unit) { return '<div class="tile"><div class="eyebrow">' + label + '</div><div class="big">' + val + (unit ? '<small>' + unit + '</small>' : '') + '</div></div>'; }
    var has = st.n > 0;
    var h = '<section aria-label="Resumen"><div class="tiles">' +
      tile('Promedio', has ? num(Math.round(st.avg * 10) / 10) : '—', has ? 'días' : '') +
      tile('Balones cerrados', String(st.n), '') +
      tile('Más corto', has ? String(st.min) : '—', has ? plural(st.min, 'día', 'días') : '') +
      tile('Más largo', has ? String(st.max) : '—', has ? plural(st.max, 'día', 'días') : '') +
      '</div>';
    if (!has) h += '<p class="note">El promedio usa los balones ya cerrados. Si tienes registros anteriores, agrégalos abajo para verlo desde ya.</p>';
    else if (st.perDay) h += '<p class="note">Gasto medio: <strong>' + money(st.perDay) + '</strong> por día y <strong>' + money(st.perTank) + '</strong> por balón.</p>';
    return h + '</section>';
  }

  function chartBlock(st) {
    var rows = st.rows.slice().sort(function (a, b) { return a.t.open < b.t.open ? -1 : 1; }).slice(-10);
    var W = 340, H = 176, top = 26, bot = 28, px = 8;
    var maxV = Math.max.apply(null, rows.map(function (r) { return r.d; }).concat([st.avg])) * 1.1 || 1;
    var ch = H - top - bot;
    var slot = (W - 2 * px) / Math.max(rows.length, 5);
    var bw = Math.min(slot * 0.62, 34);
    var x0 = px + ((W - 2 * px) - slot * rows.length) / 2;
    function y(v) { return top + ch - (v / maxV) * ch; }
    var g = '<line class="c-base" x1="' + px + '" y1="' + (top + ch) + '" x2="' + (W - px) + '" y2="' + (top + ch) + '"/>';
    rows.forEach(function (r, i) {
      var cx = x0 + slot * i + slot / 2;
      var hh = Math.max(top + ch - y(r.d), 2);
      g += '<rect class="c-bar" x="' + (cx - bw / 2).toFixed(1) + '" y="' + (top + ch - hh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + hh.toFixed(1) + '" rx="5"><title>' + range(r.t.open, r.t.close) + ': ' + r.d + ' días</title></rect>';
      g += '<text class="c-val" x="' + cx.toFixed(1) + '" y="' + (top + ch - hh - 6).toFixed(1) + '">' + r.d + '</text>';
      g += '<text class="c-lab" x="' + cx.toFixed(1) + '" y="' + (H - 9) + '">' + MES[+r.t.close.slice(5, 7) - 1] + '</text>';
    });
    g += '<line class="c-avg" x1="' + px + '" y1="' + y(st.avg).toFixed(1) + '" x2="' + (W - px) + '" y2="' + y(st.avg).toFixed(1) + '"/>';
    return '<section aria-label="Gráfico"><div class="sec-head"><h2>Días por balón</h2></div><div class="chart">' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Gráfico de barras con los días de uso de los últimos balones cerrados">' + g + '</svg>' +
      '<div class="legend"><i></i>Promedio ' + num(Math.round(st.avg * 10) / 10) + ' días · mes de cierre de cada balón</div></div></section>';
  }

  function historyBlock() {
    var h = '<section aria-label="Historial"><div class="sec-head"><h2>Historial</h2><button class="btn ghost small" data-act="past">' + I_PLUS + 'Registro anterior</button></div>';
    if (!tanks.length) {
      h += '<p class="empty">Aún no hay registros. Cada balón que abras y cierres aparecerá aquí con sus días de uso.</p>';
    } else {
      h += '<ul class="list">';
      var today = todayKey();
      tanks.forEach(function (t) {
        var isRes = !t.open;
        var isAct = !isRes && !t.close;
        var d = isRes ? 0 : (isAct ? Math.max(diff(t.open, today), 0) : diff(t.open, t.close));
        var meta = [];
        if (t.kg) meta.push(t.kg + ' kg');
        if (t.price) meta.push(money(t.price));
        var rng = isRes ? 'Comprado el ' + fmt(t.bought) : (isAct ? 'Desde ' + fmt(t.open) : range(t.open, t.close));
        var badge = isRes ? '<span class="badge">En reserva</span>' : (isAct ? '<span class="badge">En uso</span>' : '');
        var dur = isRes ? '<b>—</b><span>lleno</span>' : '<b>' + d + '</b><span>' + plural(d, 'día', 'días') + '</span>';
        var aria = isRes ? 'Editar balón de reserva comprado el ' + fmt(t.bought) : 'Editar balón, ' + d + ' ' + plural(d, 'día', 'días') + (isAct ? ', en uso' : '');
        h += '<li><button class="row' + (isAct ? ' is-active' : '') + (isRes ? ' is-reserve' : '') + '" data-act="edit" data-id="' + t.id + '" aria-label="' + aria + '">' +
          '<div class="dur">' + dur + '</div>' +
          '<div class="info"><span class="range">' + rng + '</span>' +
          '<span class="meta">' + badge + meta.join(' · ') + '</span></div>' + I_CHEV + '</button></li>';
      });
      h += '</ul>';
    }
    return h + '</section>';
  }

  function backupBlock() {
    if (window.claude) return '';
    return '<details class="backup"><summary>Respaldo de datos</summary>' +
      '<p class="muted">Los registros se guardan solo en este dispositivo. Copia un respaldo para guardarlo en Notas o llevarlo a otro equipo.</p>' +
      '<textarea id="bk-text" rows="4" spellcheck="false" aria-label="Texto del respaldo"></textarea>' +
      '<div class="bk-actions"><button class="btn ghost" data-act="bk-copy">Copiar respaldo</button><button class="btn ghost" data-act="bk-restore">Restaurar desde el texto</button></div></details>';
  }

  function render() {
    if (loading) {
      app.innerHTML = header() + '<section class="card"><span class="eyebrow">Cargando</span><p class="muted">Buscando tus registros…</p></section>';
      return;
    }
    var st = stats();
    var act = activeTank();
    var h = header() + (act ? activeCard(act, st) : emptyCard(st)) + statsBlock(st);
    if (st.n > 0) h += chartBlock(st);
    h += historyBlock() + backupBlock();
    app.innerHTML = h;
  }

  /* ---------- Hoja de registro ---------- */
  function renderSheet() {
    var s = sheet, t = s.id ? find(s.id) : null, today = todayKey();
    var known = tanks.filter(function (x) { return x.kg; })[0] || null;
    var act = activeTank(), res = reserves()[0] || null;
    var title, sub = '', openV = '', closeV = '', boughtV = '', kgV = known ? known.kg : '', priceV = '';
    var showOpen = true, showClose = false, showBought = false, submit;
    if (s.mode === 'open') {
      title = res ? 'Abrir balón de reserva' : 'Abrir nuevo balón'; openV = today; submit = 'Abrir balón';
      if (res) {
        kgV = res.kg || kgV; priceV = res.price || '';
        sub = 'Se usará el balón comprado el ' + fmt(res.bought) + '.' + (act ? ' El actual se cerrará en la misma fecha.' : '');
      } else {
        sub = act ? 'El balón actual se cerrará en la misma fecha.' : 'Desde esa fecha se cuentan los días de uso.';
      }
    } else if (s.mode === 'buy') {
      title = 'Registrar compra'; boughtV = today; showOpen = false; showBought = true; submit = 'Guardar compra';
      sub = 'Queda como balón de reserva, lleno y sin abrir. Los días de uso se cuentan desde que lo abras.';
    } else if (s.mode === 'past') {
      title = 'Registro anterior'; showClose = true; submit = 'Guardar registro';
      sub = 'Agrega un balón que ya usaste, con sus fechas de apertura y cierre.';
    } else if (!t.open) {
      title = 'Editar balón de reserva'; showOpen = false; showBought = true; submit = 'Guardar cambios';
      boughtV = t.bought; kgV = t.kg || ''; priceV = t.price || '';
    } else {
      title = t.close ? 'Editar registro' : 'Editar balón en uso'; submit = 'Guardar cambios';
      openV = t.open; closeV = t.close || ''; kgV = t.kg || ''; priceV = t.price || ''; showClose = !!t.close;
    }
    var sizes = PRESETS.slice();
    if (kgV && sizes.indexOf(+kgV) < 0) sizes.push(+kgV);
    var chips = '<input type="radio" name="kg" id="kg-none" value=""' + (!kgV ? ' checked' : '') + '><label for="kg-none">Sin dato</label>';
    sizes.forEach(function (n) {
      chips += '<input type="radio" name="kg" id="kg-' + n + '" value="' + n + '"' + (+kgV === n ? ' checked' : '') + '><label for="kg-' + n + '">' + n + ' kg</label>';
    });
    var h = '<div class="backdrop" data-act="cancel"></div>' +
      '<form class="panel" id="sheet-form" novalidate role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">' +
      '<h2 id="sheet-title">' + title + '</h2>' + (sub ? '<p class="sub">' + sub + '</p>' : '') +
      (showBought ? '<label class="field"><span>Fecha de compra</span><input type="date" id="f-bought" value="' + boughtV + '" max="' + today + '" required></label>' : '') +
      (showOpen ? '<label class="field"><span>Fecha de apertura</span><input type="date" id="f-open" value="' + openV + '" max="' + today + '" required></label>' : '') +
      (showClose ? '<label class="field"><span>Fecha de cierre</span><input type="date" id="f-close" value="' + closeV + '" max="' + today + '" required></label>' : '') +
      '<fieldset class="field"><legend>Tamaño (opcional)</legend><div class="chips">' + chips + '</div></fieldset>' +
      '<label class="field"><span>Precio pagado (opcional)</span><div class="price-wrap"><b>$</b><input type="text" id="f-price" inputmode="numeric" autocomplete="off" placeholder="Ej. 24.500" value="' + (priceV ? String(priceV).replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '') + '"></div></label>' +
      '<p class="err" id="f-err" role="alert" hidden></p>' +
      '<div class="stack"><button type="submit" class="btn primary block">' + submit + '</button>' +
      (s.mode === 'edit' && t.open && !t.close ? '<button type="button" class="btn ghost block" data-act="close-now">Cerrar hoy sin abrir otro</button>' : '') +
      (s.mode === 'edit' ? '<button type="button" class="btn danger block" data-act="delete">Eliminar registro</button>' : '') +
      '<button type="button" class="btn ghost block" data-act="cancel">Cancelar</button></div></form>';
    sheetEl.innerHTML = h;
  }

  function openSheet(m, id) {
    if (m === 'edit' && !find(id)) return;
    sheet = { mode: m, id: id || null, del: false };
    renderSheet();
    sheetEl.hidden = false;
    document.documentElement.classList.add('lock');
    var p = document.getElementById('sheet-form');
    if (p) p.focus();
  }
  function closeSheet() {
    sheet = null; sheetEl.hidden = true; sheetEl.innerHTML = '';
    document.documentElement.classList.remove('lock');
  }
  function setErr(msg) {
    var e = document.getElementById('f-err');
    if (!e) return;
    e.textContent = msg; e.hidden = !msg;
  }

  sheetEl.addEventListener('click', async function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b || !sheet) return;
    var a = b.getAttribute('data-act');
    if (a === 'cancel') { closeSheet(); return; }
    var t = sheet.id ? find(sheet.id) : null;
    if (a === 'delete') {
      if (!t) { closeSheet(); return; }
      if (!sheet.del) { sheet.del = true; b.textContent = 'Toca de nuevo para eliminar'; b.classList.add('armed'); return; }
      if (busy) return; busy = true;
      var ok = await commit([], [t.id]); busy = false;
      if (ok) { closeSheet(); toast('Registro eliminado'); }
    } else if (a === 'close-now') {
      if (!t || busy) return; busy = true;
      var c = Object.assign({}, t, { close: todayKey() });
      var ok2 = await commit([c], []); busy = false;
      if (ok2) { closeSheet(); toast('Balón cerrado'); }
    }
  });

  sheetEl.addEventListener('submit', async function (ev) {
    ev.preventDefault();
    if (!sheet || busy) return;
    var today = todayKey();
    var openEl = document.getElementById('f-open');
    var boughtEl = document.getElementById('f-bought');
    var closeEl = document.getElementById('f-close');
    var open = openEl ? openEl.value : '';
    var bought = boughtEl ? boughtEl.value : '';
    var close = closeEl ? closeEl.value : '';
    var kgEl = sheetEl.querySelector('input[name="kg"]:checked');
    var kg = kgEl && kgEl.value ? +kgEl.value : null;
    var rawP = document.getElementById('f-price').value.replace(/[.\s$]/g, '');
    if (rawP && !/^\d+$/.test(rawP)) { setErr('El precio debe ser un número, por ejemplo 24500.'); return; }
    var price = rawP ? +rawP : null;
    if (boughtEl) {
      if (!DATE_RE.test(bought)) { setErr('Indica la fecha de compra.'); return; }
      if (bought > today) { setErr('La fecha de compra no puede ser futura.'); return; }
    }
    if (openEl) {
      if (!DATE_RE.test(open)) { setErr('Indica la fecha de apertura.'); return; }
      if (open > today) { setErr('La fecha de apertura no puede ser futura.'); return; }
    }
    if (closeEl) {
      if (!DATE_RE.test(close)) { setErr('Indica la fecha de cierre.'); return; }
      if (close > today) { setErr('La fecha de cierre no puede ser futura.'); return; }
      if (close < open) { setErr('El cierre no puede ser anterior a la apertura.'); return; }
    }
    var act = activeTank(), res = reserves()[0] || null, t = sheet.id ? find(sheet.id) : null;
    var ups = [], msg = '';
    if (sheet.mode === 'open') {
      if (act && open < act.open) { setErr('El balón actual se abrió el ' + fmt(act.open) + '. La nueva apertura no puede ser anterior.'); return; }
      if (res && open < res.bought) { setErr('El balón de reserva se compró el ' + fmt(res.bought) + '. La apertura no puede ser anterior.'); return; }
      if (act) ups.push(Object.assign({}, act, { close: open }));
      if (res) ups.push(Object.assign({}, res, { open: open, kg: kg, price: price }));
      else ups.push({ id: genId(), bought: null, open: open, close: null, kg: kg, price: price });
      msg = res ? 'Balón de reserva abierto' : 'Balón abierto';
    } else if (sheet.mode === 'buy') {
      ups.push({ id: genId(), bought: bought, open: null, close: null, kg: kg, price: price });
      msg = 'Compra registrada';
    } else if (sheet.mode === 'past') {
      if (act && close > act.open) { setErr('Ese balón termina después de la apertura del balón actual (' + fmt(act.open) + '). Revisa la fecha de cierre.'); return; }
      ups.push({ id: genId(), bought: null, open: open, close: close, kg: kg, price: price });
      msg = 'Registro agregado';
    } else {
      if (!t) { closeSheet(); return; }
      if (!t.open) ups.push(Object.assign({}, t, { bought: bought, kg: kg, price: price }));
      else ups.push(Object.assign({}, t, { open: open, close: t.close ? close : null, kg: kg, price: price }));
      msg = 'Cambios guardados';
    }
    busy = true;
    var ok = await commit(ups, []);
    busy = false;
    if (ok) { closeSheet(); toast(msg); }
  });

  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && sheet) closeSheet(); });

  /* ---------- Acciones de la página ---------- */
  app.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'open') openSheet('open');
    else if (a === 'buy') openSheet('buy');
    else if (a === 'past') openSheet('past');
    else if (a === 'edit') openSheet('edit', b.getAttribute('data-id'));
    else if (a === 'bk-copy') backupCopy();
    else if (a === 'bk-restore') backupRestore(b);
  });

  function backupCopy() {
    var ta = document.getElementById('bk-text');
    var json = JSON.stringify(tanks.map(function (t) { return { id: t.id, bought: t.bought, open: t.open, close: t.close, kg: t.kg, price: t.price }; }));
    ta.value = json;
    function manual() { ta.focus(); ta.select(); toast('Selecciona el texto y cópialo'); }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(json).then(function () { toast('Respaldo copiado'); }, manual);
      else manual();
    } catch (e) { manual(); }
  }

  function backupRestore(btn) {
    var ta = document.getElementById('bk-text');
    var list = [];
    try {
      var data = JSON.parse(ta.value);
      if (!Array.isArray(data)) throw new Error('formato');
      data.forEach(function (t) { var n = norm(t); if (n) list.push(n); });
    } catch (e) { toast('El texto no es un respaldo válido'); return; }
    if (!list.length) { toast('El respaldo no tiene registros válidos'); return; }
    if (tanks.length && !restoreArmed) {
      restoreArmed = true; btn.textContent = 'Toca de nuevo para reemplazar';
      toast('Esto reemplaza los registros de este dispositivo');
      return;
    }
    restoreArmed = false;
    tanks = list; sortTanks(); saveLocal(); render();
    toast('Respaldo restaurado');
  }

  /* ---------- Arranque ---------- */
  function fallback() { mode = 'local'; db = null; loading = false; loadLocal(); render(); }

  async function connect() {
    try {
      if (!window.claude || !window.claude.use) return;
      db = await window.claude.use('db');
      if (!db) { fallback(); return; }
      mode = 'db';
      db.collection('balones').onSnapshot(function (snap) {
        var list = [];
        snap.docs.forEach(function (doc) {
          var n = norm(Object.assign({}, doc.data() || {}, { id: doc.id }));
          if (n) list.push(n);
        });
        tanks = list; sortTanks(); loading = false; render();
      }, function () { fallback(); });
    } catch (e) { fallback(); }
  }

  if (!loading) loadLocal();
  render();
  connect();

  if (!window.claude && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>

</body>
